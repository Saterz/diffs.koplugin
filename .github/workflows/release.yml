name: Release Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify beta tag branch
        if: contains(github.ref_name, '-')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/dev"; then
            echo "Beta release tags must point to a commit reachable from the dev branch." >&2
            exit 1
          fi

      - name: Install Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua-check rsync zip

      - name: Check codebase
        run: bash scripts/check.sh

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes rsync zip

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          bash scripts/extract-changelog.sh "${RELEASE_VERSION}" > release-notes.md

      - name: Create plugin ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "${RELEASE_TAG#v}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
